name: Angular 20 CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  NODE_VERSION: "24.2.0"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:

    ####################################################
    # Checkout Repository
    ####################################################
    - name: Checkout Source
      uses: actions/checkout@v4

    ####################################################
    # Install Node
    ####################################################
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    ####################################################
    # Verify Versions
    ####################################################
    - name: Verify Versions
      run: |
        node -v
        npm -v

    ####################################################
    # Install Dependencies
    ####################################################
    - name: Install Dependencies
      run: npm ci

    ####################################################
    # Angular CLI Version
    ####################################################
    - name: Angular Version
      run: npx ng version

    ####################################################
    # Lint
    ####################################################
    - name: Lint Application
      run: npm run lint
      continue-on-error: false

    ####################################################
    # Unit Tests
    ####################################################
    - name: Run Unit Tests
      run: |
        npm test -- \
        --watch=false \
        --browsers=ChromeHeadless \
        --code-coverage

    ####################################################
    # NPM Security Audit
    ####################################################
    - name: Security Audit
      run: npm audit --audit-level=high
      continue-on-error: true

    ####################################################
    # Build Production
    ####################################################
    - name: Production Build
      run: npm run build -- --configuration production

    ####################################################
    # Upload Angular Build
    ####################################################
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: angular-build
        path: dist/
        retention-days: 30

    ####################################################
    # Upload Coverage Report
    ####################################################
    - name: Upload Coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30

    ####################################################
    # Upload Test Results
    ####################################################
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          coverage
          junit.xml
        if-no-files-found: ignore